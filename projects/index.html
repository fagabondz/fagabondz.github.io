<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tabs = document.querySelectorAll('.filter-tab');
        const cards = document.querySelectorAll('.project-card');
        const emptyState = document.getElementById('filter-empty-state');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                const filter = this.getAttribute('data-filter');

                // Update active tab styling
                tabs.forEach(t => {
                    t.classList.remove('border-accent/50', 'bg-white/10', 'text-text', 'font-medium');
                    t.classList.add('border-border', 'text-muted');
                });
                this.classList.remove('border-border', 'text-muted');
                this.classList.add('border-accent/50', 'bg-white/10', 'text-text', 'font-medium');

                // Filter cards
                let visibleCount = 0;
                cards.forEach(card => {
                    const cardType = card.getAttribute('data-project-type');
                    if (filter === 'all' || cardType === filter) {
                        card.style.display = 'flex';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                if (emptyState) {
                    if (visibleCount === 0) {
                        emptyState.classList.remove('hidden');
                    } else {
                        emptyState.classList.add('hidden');
                    }
                }
            });
        });
    });
